name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "17 9 * * 1"   # weekly, so a broken runner or dependency shows up even without commits

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"    # the python3 macOS ships; no 3.9 build exists for Ubuntu 26.04
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: git identity for tests that build throwaway repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: tests
        run: python -m unittest discover -s tests -v
